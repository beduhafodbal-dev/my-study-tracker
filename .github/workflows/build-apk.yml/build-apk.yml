
name: Build MY STUDY TRACKER APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyStudyTracker-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q MyStudyTracker-Android-Project.zip -d .

      - name: Build APK
        working-directory: MyStudyTracker
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStudyTracker-APK
          path: MyStudyTracker/app/build/outputs/apk/debug/app-debug.apk
          
